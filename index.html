<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCU TABÙ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SCU TABÙ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin: 0; height: 100%; background: #fff; font-family: Arial, Helvetica, sans-serif; color: #2A2421; }
  #avvio { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; }
  #avvio img { width: 140px; height: 140px; }
  #avvio b { font-size: 24px; color: #CC0000; letter-spacing: .02em; }
  #avvio span { font-size: 15px; color: #77695F; }
  #aiuto { display: none; flex-direction: column; gap: 10px; margin-top: 12px; }
  #aiuto a { font-size: 16px; font-weight: 700; padding: 12px 20px; border-radius: 10px; text-decoration: none; border: 2px solid #CC0000; color: #CC0000; }
  #aiuto a.pri { background: #CC0000; color: #fff; }
</style>
</head>
<body>
<div id="avvio" role="status">
  <img src="icon-512.png" alt="">
  <b>SCU TABÙ</b>
  <span id="msg">Apertura del gestionale…</span>
  <div id="aiuto">
    <a id="riprova" class="pri" href="#">Riprova</a>
    <a id="browser" href="#">Apri nel browser</a>
  </div>
</div>
<script>
  /*
   * Pagina dell'icona SCU TABÙ.
   * Chiede l'app al gestionale su Google (indirizzo comune, finisce con /exec) e la mostra a schermo intero.
   * Qui non ci sono dati né codici: tutto resta su Google. NON è il link personale.
   */
  var APP = 'https://script.google.com/macros/s/AKfycbzXHSkAZ2HMrvw1ltZc-8MDAG2gwloJ7pLK1XN_Laff2ECF-teb9frxY36TPFXb5svqJg/exec';

  // La chiave personale arriva dal link personale (…?k=…) oppure è già salvata su questo telefono
  var k = '';
  function tieniInIndirizzo(c) { try { history.replaceState(null, '', location.pathname + (c ? '?k=' + encodeURIComponent(c) : '')); } catch (e) { /* niente */ } }
  try {
    var p = new URLSearchParams(location.search);
    if (p.get('esci') === '1') { localStorage.removeItem('scuK'); localStorage.removeItem('scuKey'); tieniInIndirizzo(''); }
    k = (p.get('k') || '').replace(/[^A-Za-z0-9]/g, '');
    if (k) { localStorage.setItem('scuK', k); }
    else if (p.get('esci') !== '1') { k = localStorage.getItem('scuK') || localStorage.getItem('scuKey') || ''; if (k) tieniInIndirizzo(k); }
  } catch (e) { /* senza memoria del browser si entra con il codice personale */ }

  var inst = '0';
  try { inst = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone ? '1' : '0'; } catch (e) { inst = '0'; }
  var coda = '&inst=' + inst + (k ? '&k=' + encodeURIComponent(k) : '');

  // Piano B: il gestionale nel browser, come il link di sempre
  document.getElementById('browser').href = APP + '?avvio=1&via=diretta' + coda;
  document.getElementById('riprova').onclick = function (e) { e.preventDefault(); location.reload(); };

  function problema(testo) {
    document.getElementById('msg').textContent = testo;
    document.getElementById('aiuto').style.display = 'flex';
  }

  var finito = false;
  var lento = setTimeout(function () { if (!finito) problema('Ci sta mettendo più del solito…'); }, 15000);

  fetch(APP + '?ui=1' + coda + '&t=' + Date.now(), { redirect: 'follow' })
    .then(function (r) { if (!r.ok) throw new Error('codice ' + r.status); return r.text(); })
    .then(function (html) {
      if (html.indexOf('data-via="app"') < 0) throw new Error('risposta inattesa');
      finito = true; clearTimeout(lento);
      // L'app sa a quale indirizzo mandare le sue richieste; la libreria del QR si carica senza bloccare
      var tag = '<' + 'script';
      // Nome, icona e "installa app" restano quelli di SCU TABÙ anche dopo che l'app ha preso il posto di questa pagina
      var testa = '<title>SCU TABÙ</title><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">' +
        '<link rel="icon" type="image/png" href="icon-192.png"><meta name="theme-color" content="#FFFFFF"><meta name="mobile-web-app-capable" content="yes">' +
        '<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="SCU TABÙ"><meta name="apple-mobile-web-app-status-bar-style" content="default">';
      html = html.replace('<head>', '<head>' + testa + tag + '>window.SCU_EXEC = ' + JSON.stringify(APP) + ';<\/script>')
        .split(tag + ' src=').join(tag + ' async src=');
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function () {
      finito = true; clearTimeout(lento);
      problema('Non riesco a raggiungere il gestionale. Controlla la connessione e riprova.');
    });
</script>
</body>
</html>
